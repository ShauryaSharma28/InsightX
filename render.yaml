services:
  - type: web
    name: insightx-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://shubham01-shubh.github.io
      - key: MAX_DATASET_UPLOAD_SIZE
        value: "20971520"
      - key: DATASET_BACKGROUND_THRESHOLD_BYTES
        value: "20971520"
      - key: DATASET_STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        value: insightx-private
      - key: AWS_LOCATION
        value: uploads
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
