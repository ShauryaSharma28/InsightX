name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-for-production
      DB_ENGINE: mysql
      DB_NAME: insightx
      DB_USER: root
      DB_PASSWORD: insightx-root-ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: insightx
          MYSQL_ROOT_PASSWORD: insightx-root-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install --yes default-libmysqlclient-dev build-essential pkg-config
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Django configuration
        run: python backend/manage.py check
      - name: Check for missing migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Run API tests
        run: python backend/manage.py test insightx_api
