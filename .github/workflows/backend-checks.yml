name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install --yes default-libmysqlclient-dev build-essential pkg-config
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Django configuration
        run: python backend/manage.py check
      - name: Check for missing migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Run API tests
        run: python backend/manage.py test insightx_api
